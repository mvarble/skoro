[package]
name = "skoro"
description = "Probabilistic modeling library designed for speed, modularity, and extensibility."
authors.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
skoro-backend.workspace = true
skoro-core.workspace = true
skoro-dense.workspace = true
skoro-operation.workspace = true
skoro-graph.workspace = true
skoro-model.workspace = true
skoro-normal.workspace = true
skoro-riemann.workspace = true
skoro-pointwise.workspace = true
skoro-levenberg-marquardt.workspace = true
skoro-linalg.workspace = true
skoro-so3.workspace = true
skoro-se3.workspace = true

[dev-dependencies]
approx.workspace = true

# The cross-manifold tests need `skoro-model`'s numeric-derivative helpers, which live behind
# its `testing` feature -- the same way `skoro-so3` and `skoro-se3` ask for them.
skoro-model = { workspace = true, features = ["testing"] }
