[package]
name = "skoro-normal"
description = "Normal distribution interface for Skoro."
authors.workspace = true
edition.workspace = true
version.workspace = true

[dependencies]
burn.workspace = true

skoro-backend.workspace = true
skoro-core.workspace = true
skoro-operation.workspace = true
skoro-graph.workspace = true
skoro-linalg.workspace = true
skoro-model.workspace = true
skoro-riemann.workspace = true
skoro-pointwise.workspace = true

[dev-dependencies]
approx.workspace = true
# `SE3` is 6-dimensional over 12 components, which is the case that catches a residual
# sized by storage. No cycle: `skoro-se3` does not depend on `skoro-normal`.
skoro-se3.workspace = true
skoro-so3.workspace = true
# The Fisher-information integration tests check the graph's roots against host references
# built with `Dense`/`spd_solve`, and read tensors back with `skoro_model::test_utils`, which
# lives behind the `testing` feature. Neither pulls in a cycle: `skoro-dense` depends only on
# `skoro-backend`/`skoro-core`.
skoro-dense.workspace = true
skoro-model = { workspace = true, features = ["testing"] }
