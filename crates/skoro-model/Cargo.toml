[package]
name = "skoro-model"
description = "General model interface for skoro."
authors.workspace = true
edition.workspace = true
version.workspace = true

[features]
testing = ["approx", "ndarray"]
default = []

[dependencies]
skoro-backend.workspace = true
skoro-core.workspace = true
skoro-operation.workspace = true
skoro-graph.workspace = true
skoro-riemann.workspace = true
lazy_static = "1.5.0"
dashmap = "6.1.0"
crossbeam-queue = "0.3.12"
approx = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true, features = ["approx"] }

[dev-dependencies]
approx.workspace = true
trybuild.workspace = true

# This crate's own `test_utils` lives behind the `testing` feature, so its own integration
# tests have to ask for it the same way `skoro-so3` and `skoro-linalg` do.
skoro-model = { workspace = true, features = ["testing"] }

# Duplicated from `[dependencies]` so `trybuild`'s generated manifest can reach them: it
# lists the host crate plus its dev-dependencies, not the host's own dependencies.
skoro-backend.workspace = true
skoro-riemann.workspace = true
