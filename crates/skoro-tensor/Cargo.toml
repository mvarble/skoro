[package]
name = "skoro-tensor"
description = "The tensor layer of skoro: burn, at an explicit precision on a device skoro supports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
wgpu = ["burn/wgpu"]

[dependencies]
burn.workspace = true
burn-dispatch.workspace = true

[dev-dependencies]
# Backends skoro refuses, for the tests that check it does: both are plain Rust.
burn = { workspace = true, features = ["ndarray", "autodiff"] }

[lints]
workspace = true
