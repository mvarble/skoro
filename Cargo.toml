[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
authors = ["Matthew Varble <matthew@rodent.club"]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
approx = "0.5.1"
burn = "0.21"
burn-cubecl = "0.21"
burn-ndarray = "0.21"
cubecl = "0.10"
ndarray = "0.17.2"
num-traits = "0.2"

skoro-backend = { path = "./crates/skoro-backend" }
skoro-core = { path = "./crates/skoro-core" }
skoro-operation = { path = "./crates/skoro-operation" }
skoro-graph = { path = "./crates/skoro-graph" }
skoro-linalg = { path = "./crates/skoro-linalg" }
skoro-model = { path = "./crates/skoro-model" }
skoro-riemann = { path = "./crates/skoro-riemann" }
skoro-pointwise = { path = "./crates/skoro-pointwise" }
skoro-so3 = { path = "./crates/skoro-so3" }
skoro-se3 = { path = "./crates/skoro-se3" }
